<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e6fc9" />
      <stop offset="55%" stop-color="#6fa8e0" />
      <stop offset="100%" stop-color="#cfe6f7" />
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fc76a" />
      <stop offset="100%" stop-color="#6fae4c" />
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5ba23f" />
      <stop offset="100%" stop-color="#2f6b2f" />
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffef0" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fffef0" stop-opacity="0" />
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)" />

  <circle cx="1180" cy="150" r="220" fill="url(#sun)" />

  <g fill="#ffffff" opacity="0.9" filter="url(#soft)">
    <ellipse cx="260" cy="150" rx="110" ry="34" />
    <ellipse cx="340" cy="130" rx="80" ry="28" />
    <ellipse cx="190" cy="130" rx="70" ry="24" />

    <ellipse cx="820" cy="90" rx="130" ry="30" />
    <ellipse cx="900" cy="75" rx="90" ry="24" />

    <ellipse cx="1350" cy="260" rx="100" ry="26" />
    <ellipse cx="1420" cy="245" rx="70" ry="20" />
  </g>

  <path d="M0,620 C260,540 480,560 720,610 C980,665 1180,600 1600,560 L1600,900 L0,900 Z"
        fill="url(#hillFar)" opacity="0.85" />

  <path d="M0,760 C220,680 460,700 700,750 C1000,815 1260,730 1600,700 L1600,900 L0,900 Z"
        fill="url(#hillNear)" />
</svg>
