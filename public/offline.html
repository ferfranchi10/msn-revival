<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <title>Sin conexión · MSN Revival</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center;
        padding: 16px; background: #0b1220; color: #fff;
        font-family: Tahoma, Verdana, Arial, sans-serif; text-align: center;
      }
      .win {
        width: 100%; max-width: 340px; overflow: hidden; border-radius: 6px;
        border: 1px solid #8fa3c7; box-shadow: 0 3px 14px rgba(0,0,0,.55); color: #1f2d3d;
      }
      .title {
        padding: 6px 10px; text-align: left; font-size: 13px; font-weight: bold; color: #fff;
        background: linear-gradient(#5b8cc5, #3e73b8 50%, #2e5f9e); border-bottom: 1px solid #274d80;
      }
      .body { padding: 22px 18px; background: linear-gradient(#fff, #dde5f3); }
      .emoji { font-size: 40px; line-height: 1; }
      h1 { margin: 12px 0 6px; font-size: 16px; }
      p { margin: 0 0 16px; font-size: 13px; color: #33445a; }
      button {
        padding: 6px 18px; font: inherit; font-size: 13px; color: #1f2d3d; cursor: pointer;
        border: 1px solid #8fa3c7; border-radius: 3px; background: linear-gradient(#fff, #c7d3e6);
      }
    </style>
  </head>
  <body>
    <div class="win">
      <div class="title">MSN Revival</div>
      <div class="body">
        <div class="emoji" aria-hidden="true">📡</div>
        <h1>Sin conexión</h1>
        <p>No se pudo llegar al servidor. Revisa tu conexión a internet e inténtalo de nuevo.</p>
        <button type="button" onclick="location.reload()">Reintentar</button>
      </div>
    </div>
  </body>
</html>
